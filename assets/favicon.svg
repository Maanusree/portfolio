<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Transparent background around the circle -->
  <!-- Dark Circle Badge -->
  <circle cx="32" cy="32" r="30" fill="#090d16" />
  
  <!-- Outer Globe Boundary Circle -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Equator (Horizontal line) -->
  <line x1="13" y1="32" x2="51" y2="32" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Central Prime Meridian (Vertical line) -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Curved Longitude Ellipse (Inner vertical curve) -->
  <ellipse cx="32" cy="32" rx="9" ry="19" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Upper Latitude Curve -->
  <path d="M 17 22.5 C 23 25.5, 41 25.5, 47 22.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Lower Latitude Curve -->
  <path d="M 17 41.5 C 23 38.5, 41 38.5, 47 41.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
</svg>
